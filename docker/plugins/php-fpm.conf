; PHP-FPM raeumt die Umgebung normalerweise auf, bevor es ein Skript
; startet (clear_env = yes). Dann kaeme CATALOG_BASE_URL aus der
; compose-Datei nie bei getenv() an, und index.php baute die Adresse
; still aus den Kopfzeilen des Proxys - was meistens richtig ist und
; genau dann falsch, wenn man es einstellen wollte.
[www]
clear_env = no
