name: plugins-katalog

# Der Katalogserver. Eigener Stack, eigener Lebenslauf - er hat mit dem
# Twitch-Controller nur das Proxy-Netz gemeinsam.
#
#   src/public/     das Docroot: eine Datei, der Katalog
#   src/plugins/    das geklonte Plugin-Repository
#
# Die Pakete liegen also NEBEN dem Docroot. Damit ist der Quelltext der
# Plugins gar nicht erst erreichbar, statt ihn im Auslieferer wieder
# aussperren zu muessen.
#
# Einrichten:
#
#   git clone git@github.com:ChiroxTreichel/twitch-controller-plugins.git src/plugins
#   docker compose up -d
#
# Veroeffentlichen: im Plugin-Repository packen und pushen, hier
# "git -C src/plugins pull". Kein Neustart - der Katalog liest bei
# jedem Aufruf neu.

services:
  # --- Ausliefern -------------------------------------------------------
  web:
    image: nginx:1.27-alpine
    volumes:
      # Nur lesend. Der Katalog erzeugt nichts und schreibt nichts.
      - ./src:/var/www/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
    networks:
      default: {}
      proxy:
        # Darauf zeigt der Proxy-Host im Nginx Proxy Manager:
        # Forward Hostname "plugins", Forward Port 80.
        aliases:
          - plugins
    restart: always

  # --- Den Katalog rechnen ----------------------------------------------
  # Kein Port nach aussen und kein Alias im Proxy-Netz: hier kommt
  # niemand direkt hin, und das soll auch so bleiben.
  php-fpm:
    image: php:8.4-fpm-alpine
    volumes:
      - ./src:/var/www/html:ro
      - ./php-fpm.conf:/usr/local/etc/php-fpm.d/zz-katalog.conf:ro
    environment:
      # Leer lassen ist der Normalfall: dann baut index.php die Adresse
      # aus den Kopfzeilen des Proxys. Eintragen muss man sie nur, wenn
      # der Proxy sie nicht weiterreicht - eine falsche Adresse hier
      # heisst, dass alle Download-Links ins Leere zeigen.
      CATALOG_BASE_URL: ${CATALOG_BASE_URL:-}
    restart: always

networks:
  # Das Netz gehoert dem Proxy und wird hier NICHT angelegt - es muss
  # dasselbe sein, in dem auch der Twitch-Controller haengt. Welches das
  # ist, steht in dessen .env unter PROXY_NETWORK.
  #
  # Ohne "external" legte Compose ein eigenes an: der Alias existierte,
  # und der Proxy faende ihn trotzdem nicht. Ein Abbruch ist die
  # freundlichere Auskunft.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
