# Der Katalogserver.
#
# Das Docroot ist src/public/ und enthaelt EINE Datei: den Katalog. Die
# Pakete liegen daneben in src/plugins/ - ausserhalb des Docroots.
#
# Damit ist der Quelltext der Plugins gar nicht erst erreichbar, statt
# ihn hier wieder aussperren zu muessen. Eine Sperrliste haette ich
# frueher oder spaeter unvollstaendig gelassen; was nicht im Docroot
# liegt, kann ich nicht vergessen.
#
# Erreichbar ist also genau dreierlei:
#
#   /                          der Katalog, mit ?search=
#   /<slug>/<slug>.zip         die Pakete
#   /<slug>/README.md          die Beschreibungen

server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    # Der Katalog ist die Startseite.
    location = / {
        rewrite ^ /index.php last;
    }

    # Genau diese eine PHP-Datei laeuft. Mehr gibt es im Docroot auch
    # nicht - die Beschraenkung steht trotzdem da, damit sie stehen
    # bleibt, wenn doch einmal eine zweite Datei dazukommt.
    location = /index.php {
        fastcgi_pass php-fpm:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Die Pakete - aus dem Plugin-Repository neben dem Docroot.
    # try_files entscheidet: was es nicht gibt, gibt es nicht.
    location ~ "^/[a-z0-9][a-z0-9-]{1,38}[a-z0-9]/[a-z0-9][a-z0-9-]*\.zip$" {
        root /var/www/html/plugins;
        types { }
        default_type application/zip;
        add_header Content-Disposition "attachment";
        try_files $uri =404;
    }

    # Die Beschreibungen. Als Text und nicht als Download: der
    # Controller holt sie mit "Accept: text/markdown" und rendert sie
    # selbst - HTML von hier wuerde er ohnehin nicht uebernehmen.
    location ~ "^/[a-z0-9][a-z0-9-]{1,38}[a-z0-9]/README\.md$" {
        root /var/www/html/plugins;
        types { }
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    access_log /dev/stdout;
    error_log /dev/stderr warn;
}
