<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # Logs gehen an stdout/stderr -> "docker compose logs -f web"
    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # --- Hinter Reverse Proxy (Caddy oder NPM) -----------------------------
    # Echte Client-IP statt der Proxy-IP im Log und in $_SERVER.
    RemoteIPHeader X-Forwarded-For
    RemoteIPTrustedProxy 10.0.0.0/8
    RemoteIPTrustedProxy 172.16.0.0/12
    RemoteIPTrustedProxy 192.168.0.0/16
    # Damit $_SERVER['HTTPS'] auch stimmt, wenn TLS am Proxy endet - davon
    # haengt das Secure-Flag der Session-Cookies ab.
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    # Statische Dateien unter /assets/ tragen einen Aenderungsstempel in
    # der Adresse (siehe App::asset). Damit darf der Browser sie
    # beliebig lange behalten - eine neue Fassung hat eine neue Adresse.
    <IfModule mod_headers.c>
        <LocationMatch "^/assets/">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </LocationMatch>
    </IfModule>

    <Directory /var/www/html/public>
        Options FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Vorhandene Dateien (assets/, uploads/) liefert Apache direkt,
        # alles andere geht an den Front-Controller. Der verteilt an die
        # Routen von Kern und Plugins.
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ /index.php [QSA,L]

        # Authorization-Header an PHP durchreichen
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    </Directory>

    # --- Hochgeladenes wird ausgeliefert, nicht ausgefuehrt ---------------
    #
    # Hier landet, was der Streamer ueber das Dateifeld hochlaedt:
    # Alert-Videos und Klaenge. Der erste Riegel steckt im Code - die
    # Erlaubnisliste in Core\Upload\Media laesst nur Medienendungen
    # herein, und der Dateiname wird neu gebaut statt bereinigt.
    #
    # Das hier ist der zweite. Er gilt fuer alles, was in diesem Ordner
    # liegt, egal wer es dort hineingeschrieben hat - ein Fehler in der
    # ersten Pruefung, ein Plugin, ein Griff auf der Konsole. Der
    # Unterschied zwischen "eine Datei liegt herum" und "ein fremdes
    # Programm laeuft auf dem Server" ist genau diese Zeile.
    #
    # Zweimal abgesichert, und das ist Absicht:
    #
    #   engine off    schaltet PHP fuer diesen Ordner ab. Nur mit
    #                 mod_php, darum in IfModule - waere der Name eines
    #                 Tages ein anderer, faellt die Zeile lautlos weg,
    #                 und Apache startet trotzdem. Lautlos ist hier
    #                 vertretbar, weil der zweite Riegel bleibt.
    #   FilesMatch    verweigert die Auslieferung ganz. Das gilt ohne
    #                 jedes Modul und auch fuer .pl, .py, .sh - fuer
    #                 alles, was irgendein Server ausfuehren koennte.
    <Directory /var/www/html/public/uploads>
        Options -ExecCGI -Includes

        <IfModule php_module>
            php_admin_flag engine off
        </IfModule>

        # (?i) ist kein Tippfehler: FilesMatch unterscheidet sonst
        # Gross und Klein, und ".PHP" kaeme durch.
        <FilesMatch "(?i)\.(?:ph(?:p[0-9]?|tml|ar|ps)|cgi|pl|py|sh|htaccess)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # core/, plugins/, bin/, legacy/ und .env liegen ausserhalb des
    # DocumentRoots und sind damit nicht ueber HTTP erreichbar.
</VirtualHost>
